<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="سامانه هوشمند اتوماسیون گزارش‌نویسی سازمانی — نسخه محلی ۲٫۵ با Drill-down شهرستانی همه استان‌ها، اتصال واقعی AI بدون CORS و مدیریت قالب بهبودیافته">
<title>گزارش‌ساز هوشمند سازمانی</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6fed' stroke-width='2'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpath d='M14 2v6h6'/%3E%3Cpath d='M9 15l2 2 4-4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="app">
  <!-- ═══════════ سربرگ ═══════════ -->
  <header id="app-header">
    <div class="header-inner">
      <div class="brand" id="brand-home" title="بازگشت به داشبورد">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
        </span>
        <div class="brand-text">
          <strong>گزارش‌ساز هوشمند</strong>
          <small>اتوماسیون گزارش‌نویسی سازمانی</small>
        </div>
      </div>
      <div class="header-search">
        <input id="global-search" class="input" type="search" placeholder="جستجوی بخش‌ها و قابلیت‌ها… (مثلاً: غلط املایی، نمودار، خروجی)" autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>
      <div class="header-actions">
        <div class="history-actions">
          <button class="icon-btn undo-btn" id="btn-undo-global" title="واگرد آخرین عملیات (Ctrl+Z) — تا ۳۰ مرحله در تمام بخش‌ها" aria-label="Undo" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            <span class="undo-count" id="undo-count" hidden></span>
          </button>
          <button class="icon-btn undo-btn" id="btn-redo-global" title="اجرای مجدد (Ctrl+Y)" aria-label="Redo" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
          </button>
          <button class="icon-btn" id="btn-history-global" title="تاریخچه گزارش‌ها" aria-label="تاریخچه">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 14"/></svg>
          </button>
          <button class="icon-btn" id="btn-backup" title="پشتیبان‌گیری از داده‌ها و گزارش‌ها" aria-label="Backup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          </button>
        </div>
        <div class="ai-status-chip demo" id="ai-status-chip" title="وضعیت سرویس هوش مصنوعی">
          <span class="dot"></span>
          <span id="ai-status-text">حالت نمایشی AI</span>
        </div>
        <button class="icon-btn account-btn" id="btn-account" title="ورود یا ثبت‌نام در سیستم محلی" aria-label="حساب کاربری">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="account-label">ورود / ثبت‌نام</span>
        </button>
        <button class="icon-btn" id="theme-toggle" title="تغییر حالت روز/شب" aria-label="تغییر حالت روز/شب">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════ ریبون ثانویه تنظیمات پیش‌نمایش (فقط در مرحله پیش‌نمایش؛ هرگز روی صفحه گزارش نمی‌افتد) ═══════════ -->
  <div id="sub-ribbon" hidden aria-label="تنظیمات پیش‌نمایش"></div>

  <!-- ═══════════ نقشه سفر یکتا (ستون سمت راست؛ در موبایل نوار افقی بالای محتوا) ═══════════ -->
  <div id="shell-layout">
    <aside id="journey-rail" aria-label="نقشه سفر گزارش (شماره ۱ تا ۹)"><!-- با JS رندر می‌شود --></aside>
    <main id="main">
      <section class="view" id="view-dashboard" hidden></section>
      <section class="view" id="view-history" hidden></section>
      <section class="view" id="view-import" hidden></section>
      <section class="view" id="view-quality" hidden></section>
      <section class="view" id="view-clean" hidden></section>
      <section class="view" id="view-template" hidden></section>
      <section class="view" id="view-calc" hidden></section>
      <section class="view" id="view-charts" hidden></section>
      <section class="view" id="view-ai" hidden></section>
      <section class="view" id="view-preview" hidden></section>
      <section class="view" id="view-export" hidden></section>
    </main>
  </div>

  <!-- ═══════════ پابرگ ═══════════ -->
  <footer id="app-footer">
    <div class="footer-inner">
      <span>نسخه ۲٫۵٫۰ — Drill-down شهرستانی هر ۳۱ استان + اتصال واقعی AI از مسیر امن سرور (بدون CORS) + کادرهای آپلود جدید + پاک‌سازی سریع متن گزارش</span>
      <span class="footer-privacy">پردازش داده فقط در سیستم شما انجام می‌شود؛ سرور محلی فقط روی ۱۲۷٫۰٫۰٫۱ گوش می‌دهد.</span>
    </div>
  </footer>
</div>

<!-- کانتینرهای عمومی -->
<div id="toast-container" aria-live="polite"></div>
<div id="modal-root"></div>
<!-- ریشه چاپ/PDF -->
<div id="print-root"></div>

<!-- ═══════════ کتابخانه‌های بیرونی (آفلاین + fallback CDN) ═══════════ -->
<script src="vendor/xlsx.full.min.js"></script>
<script>
  /* fallback: اگر نسخه محلی کتابخانه در دسترس نبود، از CDN بارگذاری شود */
  (function () {
    function loadFallback(src) { document.write('<script src="' + src + '"><\/script>'); }
    if (typeof XLSX === 'undefined') loadFallback('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  })();
</script>
<script src="vendor/chart.umd.min.js"></script>
<script>
  (function () {
    function loadFallback(src) { document.write('<script src="' + src + '"><\/script>'); }
    if (typeof Chart === 'undefined') loadFallback('https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js');
  })();
</script>

<!-- ═══════════ ماژول‌های برنامه (ترتیب بارگذاری مهم است) ═══════════ -->
<script src="assets/js/10-utils.js"></script>
<script src="assets/js/12-undo-manager.js"></script>
<script src="assets/js/15-ui-kit.js"></script>
<script src="assets/js/17-filter-engine.js"></script>
<script src="assets/js/18-slicer-engine.js"></script>
<script src="assets/js/20-app-state.js"></script>
<script src="assets/js/25-workflow-manager.js"></script>
<script src="assets/js/28-table-detector.js"></script>
<script src="assets/js/29-join-engine.js"></script>
<script src="assets/js/30-data-importer.js"></script>
<script src="assets/js/40-data-profiler.js"></script>
<script src="assets/js/45-chart-builder.js"></script>
<script src="assets/js/46-custom-charts.js"></script>
<script src="assets/js/47-iran-geo-data.js"></script>
<script src="assets/js/47-iran-map.js"></script>
<script src="assets/js/50-data-cleaner.js"></script>
<script src="assets/js/60-duplicate-manager.js"></script>
<script src="assets/js/70-template-manager.js"></script>
<script src="assets/js/80-calculation-engine.js"></script>
<script src="assets/js/90-ai-service.js"></script>
<script src="assets/js/95-report-renderer.js"></script>
<script src="assets/js/97-pdf-exporter.js"></script>
<script src="assets/js/98-backup-manager.js"></script>
<script src="assets/js/99-ui-main.js"></script>
<script src="assets/js/100-ui-import-quality.js"></script>
<script src="assets/js/101-ui-clean.js"></script>
<script src="assets/js/102-ui-template-calc.js"></script>
<script src="assets/js/103-ui-ai-preview-export.js"></script>
<script src="assets/js/104-ui-charts.js"></script>
<script src="assets/js/106-auth.js"></script>
<script src="assets/js/107-ui-join.js"></script>
<script src="assets/js/105-ui-shell.js"></script>
<script>
  /* راه‌اندازی برنامه پس از بارگذاری کامل DOM */
  document.addEventListener('DOMContentLoaded', function () {
    try {
      UI.init();
      authUI.init();
      uiShell.init();
    } catch (err) {
      console.error('خطای راه‌اندازی برنامه:', err);
      document.getElementById('main').innerHTML =
        '<div class="fatal-error"><h2>خطا در راه‌اندازی برنامه</h2><p>' +
        String(err && err.message ? err.message : err) +
        '</p><p>لطفاً کنسول مرورگر (F12) را بررسی کنید.</p></div>';
    }
  });
</script>
</body>
</html>
